name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

# Pages 部署需要这三个权限
permissions:
  contents: read
  pages: write
  id-token: write

# 同时只跑一个部署；已经在跑的不打断，避免线上出现半成品
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      # 测试放在构建之前，且不加 continue-on-error：
      # 测试挂了就不该产出、更不该上线。
      - name: 单元测试
        run: npm test

      - name: 端到端测试
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e

      - name: 构建
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
